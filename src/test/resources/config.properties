# ========================================================
# Fossil India E-Commerce Test Automation Configuration
# ========================================================

# Browser selection: chrome, firefox, edge
browser=chrome

# Headless execution: true or false
headless=false

# Application Under Test (AUT) Base URL
baseUrl=https://www.fossil.in/

# Timeouts in seconds (Synchronization)
implicitWait=10
explicitWait=20
pageLoadTimeout=35

# Default Test Search Keywords
searchKeyword=Chronograph
fallbackProductUrl=https://www.fossil.in/en-in/products/grant-chronograph-black-leather-watch/FS4832.html

# Test User Credentials (for Login flow verification)
testEmail=automation_test_user@gmail.com
testPassword=TestPassword@123

# Extent Reports settings
reportPath=test-output/ExtentReport.html
reportTitle=Fossil E-Commerce Automation Test Results
reportName=Fossil.in UI Functional & E2E Regression Suite

